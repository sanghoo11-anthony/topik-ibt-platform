version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: topik-postgres
    restart: always
    environment:
      POSTGRES_USER: topik_user
      POSTGRES_PASSWORD: topik_password
      POSTGRES_DB: topik_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: topik-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
